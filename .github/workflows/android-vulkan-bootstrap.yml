name: Android Vulkan Bootstrap

on:
  push:
    branches: [android-vulkan-bootstrap]
    paths:
      - "android-vulkan/**"
      - ".github/workflows/android-vulkan-bootstrap.yml"
  pull_request:
    paths:
      - "android-vulkan/**"
      - ".github/workflows/android-vulkan-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: android-vulkan
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gtav-native-android-vulkan-debug
          path: android-vulkan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
